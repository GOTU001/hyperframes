<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>HyperFrames · 第一个视频</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Microsoft YaHei";
        src: local("Microsoft YaHei");
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #101921;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        color: #f4f7fa;
        font-family: "Microsoft YaHei", system-ui, sans-serif;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      .content {
        padding: 140px 150px;
      }
      .eyebrow {
        margin: 0 0 42px;
        color: #ffbd70;
        font-size: 34px;
        letter-spacing: 8px;
      }
      h1 {
        margin: 0;
        font-size: 116px;
        line-height: 1.3;
        letter-spacing: -4px;
      }
      .subtitle {
        margin: 30px 0 72px;
        font-size: 40px;
        color: #bac9d5;
      }
      .steps {
        display: flex;
        gap: 26px;
      }
      .step {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 26px 36px;
        border: 1px solid #6d8295;
        border-radius: 18px;
        background: #1c2c3a;
        font-size: 34px;
      }
      .number {
        color: #ffbd70;
        font-size: 26px;
      }
      .footer {
        position: absolute;
        left: 150px;
        right: 150px;
        bottom: 96px;
        display: flex;
        justify-content: space-between;
        color: #bac9d5;
        font-size: 26px;
      }
      .progress-track {
        position: absolute;
        left: 150px;
        right: 150px;
        bottom: 64px;
        height: 5px;
        background: #445666;
      }
      .progress {
        height: 100%;
        background: #ffbd70;
        transform-origin: left center;
      }
    </style>
  </head>
  <body>
    <div
      data-hf-id="hf-199x"
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <section
        data-hf-id="hf-21pv"
        id="intro"
        class="clip"
        data-start="0"
        data-duration="10"
        data-track-index="0"
      >
        <div data-hf-id="hf-mcm7" class="content">
          <p data-hf-id="hf-izfo" class="eyebrow">HYPERFRAMES</p>
          <h1 data-hf-id="hf-t3cw" id="title">让页面，变成视频。</h1>
          <p data-hf-id="hf-47fs" class="subtitle">用代码精确修改每一个画面。</p>
          <div data-hf-id="hf-70xd" class="steps">
            <div data-hf-id="hf-hltq" class="step">
              <span data-hf-id="hf-g3id" class="number">01</span>写页面
            </div>
            <div data-hf-id="hf-ksx6" class="step">
              <span data-hf-id="hf-hafg" class="number">02</span>调动画
            </div>
            <div data-hf-id="hf-gpyl" class="step">
              <span data-hf-id="hf-gw4f" class="number">03</span>导出视频
            </div>
          </div>
        </div>
        <div data-hf-id="hf-yh7l" class="footer">
          <span data-hf-id="hf-6ux7">HTML + CSS + GSAP → MP4</span
          ><span data-hf-id="hf-1px9">你的第一个 10 秒视频</span>
        </div>
        <div data-hf-id="hf-lxwj" class="progress-track">
          <div data-hf-id="hf-31j5" class="progress"></div>
        </div>
      </section>
    </div>
    <script>
      // Seconds on this one paused timeline are controlled by HyperFrames.
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".eyebrow", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.6 }, 0);
      tl.fromTo(
        "#title",
        { opacity: 0, y: 40 },
        { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" },
        0.3,
      );
      tl.fromTo(".subtitle", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7 }, 1.2);
      tl.fromTo(
        ".step",
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.6, stagger: 0.8 },
        2,
      );
      tl.fromTo(".progress", { scaleX: 0 }, { scaleX: 1, duration: 10, ease: "none" }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
